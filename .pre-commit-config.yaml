repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.14
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
      - id: xmllint
        name: xmllint
        entry: xmllint --noout
        language: system
        types: [xml]

# Notes:
# 1. Order: uv-lock → ruff-format → ruff-check → pyright → pytest → xmllint
# 2. `uv-lock` keeps uv.lock in sync with pyproject.toml
# 3. Python tools run via `uv run` (single version source: pyproject.toml)
# 4. `ruff-format` precedes `ruff-check` so linting validates formatted code
# 5. `--exit-non-zero-on-fix` blocks commits on ruff auto-fixes, review first
# 6. `pass_filenames: false` on Python hooks runs on entire codebase