[build-system]
# Packaged for the [project.scripts] CLIs only; never published.
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "docs-for-ai"
version = "0.1.0"
description = "Curate and index clean docs for targeted AI context"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "firecrawl-py>=4.37.0", # scrape docs to markdown
]

[project.scripts]
curate-doc = "docs_for_ai.curate_doc:main"
sync-index = "docs_for_ai.sync_index:main"
update-descriptions = "docs_for_ai.update_descriptions:main"

[dependency-groups]
dev = [
  "pre-commit>=4.6.2",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "rich>=15.0.0",
  "ruff>=0.16.3",
]


# TESTING (PYTEST)
# =================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra" # end-of-run summary for every non-passing test
markers = [
  "firecrawl: hits FireCrawl API (paid, network)",
  "direct_fetch: fetches a real source directly, no FireCrawl (free, network)",
]


# TYPE CHECKING (PYRIGHT)
# =================================
[tool.pyright]
typeCheckingMode = "standard" # pyright's default; strict fights untyped libs
pythonVersion = "3.14"
venvPath = "."                # Claude Code Official: LSP plugin
venv = ".venv"                # Claude Code Official: LSP plugin
reportUnusedImport = false    # Ruff F401 covers it
reportUnusedVariable = false  # Ruff F841
reportDuplicateImport = false # Ruff F811


# LINTING (RUFF)
# =================================
[tool.ruff]
line-length = 88
target-version = "py314"
# Protect corpus (ruff formats code blocks in md)
extend-exclude = ["collections"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [ # ignore incompatible or overly pedantic rules
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D203",   # blank line before class docstring (conflicts with D211)
  "D213",   # multi-line summary starts on line 2 (conflicts with D212)
  "COM812", # Trailing comma missing (conflicts with formatter)
  "ISC001", # implicit string concatenation (conflicts with formatter)
  "T201",   # Print found (allow print statements)
  "CPY001", # Missing copyright notice (never published)
]

[tool.ruff.lint.per-file-ignores]
"src/docs_for_ai/*" = [
  "S314",   # XML parsing (safe — trusted local files only)
  "S603",   # subprocess call: check for execution of untrusted input
  "DTZ011", # date.today() appropriate for local date tracking
]
"tests/**" = [
  "S101",    # assert statements are idiomatic in tests
  "PLR2004", # literal expected values are fine
  "D1",      # docstrings not required in tests (D100-D107)
  "S314",    # XML parsing (safe — trusted test data only)
  "S603",    # subprocess call: check for execution of untrusted input
  "S607",    # Partial executable paths (controlled test env)
  "DTZ011",  # date.today() appropriate for matching script behavior
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Both sections restate Ruff's defaults — kept visible
[tool.ruff.lint.pylint]
max-args = 5        # PLR0913
max-branches = 12   # PLR0912
max-returns = 6     # PLR0911
max-statements = 50 # PLR0915

[tool.ruff.lint.mccabe]
max-complexity = 10 # C901
