# =================================
# Project Metadata & Configuration
# =================================
[project]
name = "docs-for-ai"
version = "0.1.0"
description = "Curate and index clean docs for AI context and keep it fresh (with Claude Code)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "firecrawl-py>=4.27.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]


# =================================
# Pyright Type Checking
# =================================
[tool.pyright]
# Type checker — Ruff only lints, doesn't type-check.
# In VSCode, Pylance reads this config (Pylance bundles Pyright).
# The CLI `uv run pyright` reads the same config.

typeCheckingMode = "standard"
pythonVersion = "3.14"

# Silence rules Ruff already reports these
reportUnusedImport = false      # Ruff F401
reportUnusedVariable = false    # Ruff F841
reportDuplicateImport = false   # Ruff F811


# =================================
# Ruff Linter Configuration
# =================================
[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]    # All rules (strictest)
ignore = [  # Ignore rules that are incompatible or overly pedantic
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D203",    # 1 blank line required before class docstring (conflicts with D211)
    "D213",    # Multi-line docstring summary should start at the second line (conflicts with D212)
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "ISC001",  # Implicitly concatenated string literals on one line (conflicts with formatter)
    "T201",    # Print found (allow print statements)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = [
    "S314",    # XML parsing (safe - trusted local files only)
    "S603",    # subprocess call: check for execution of untrusted input
    "DTZ011",  # date.today() appropriate for local date tracking
]
"tests/*" = [
    "D103",    # Missing docstring in public function
    "PLR2004", # Magic value used in comparison
    "S101",    # Use of assert detected
    "S314",    # XML parsing (safe - trusted test data only)
    "S603",    # subprocess call: check for execution of untrusted input
    "S607",    # Partial executable paths (controlled test env)
    "DTZ011",  # date.today() appropriate for matching script behavior
]

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10


# =================================
# Pytest Configuration
# =================================
[tool.pytest.ini_options]
# scripts/curate_doc.py does `import github_source` (bare) so it runs as
# `python scripts/curate_doc.py`. Put scripts/ on sys.path for pytest too.
pythonpath = ["scripts"]
markers = [
    "firecrawl: hits FireCrawl API (paid, network)",
    "github: hits raw.githubusercontent.com (free, network)",
]
