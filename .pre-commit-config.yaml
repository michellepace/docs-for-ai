default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.21
    hooks:
      - id: uv-lock

  - repo: https://github.com/maxwinterstein/shfmt-py
    rev: v4.0.0
    hooks:
      - id: shfmt
        args: [-w, -i, '2', -ci, -sr, -bn]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: xmllint
        name: xmllint
        entry: xmllint --noout
        language: system
        types: [xml]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyproject]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyproject]
        pass_filenames: false

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, pyproject]
        pass_filenames: false

      - id: pytest-commit
        name: pytest (offline unit tests)
        entry: uv run pytest -m "not firecrawl and not github"
        language: system
        types_or: [python, pyproject]
        pass_filenames: false

      - id: pytest-push
        name: pytest (full suite, incl. firecrawl)
        entry: uv run pytest
        language: system
        types_or: [python, pyproject]
        pass_filenames: false
        stages: [pre-push]

# Notes (non-obvious)
# 1. pre-push alone runs firecrawl tests (to skip: git push --no-verify)
# 2. `pass_filenames: false` runs hook against the whole project
# 3. types_or [python, pyproject] fires on *.py + pyproject.toml only

# Install hooks (must): default_install_hook_types installs both stages.
#   uv run pre-commit install
