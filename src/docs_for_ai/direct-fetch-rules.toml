# Site prefixes whose pages have a directly-fetchable twin (a raw .md).
# Add a prefix here so its pages are direct-fetched, not scraped via FireCrawl.
# Each key is a rule; its list holds the site prefixes that rule covers.

# Example:
# Clerk has https://clerk.com/docs/guides/ai/skills
#  with twin https://clerk.com/docs/guides/ai/skills.md
append-md = [
  "https://claude.com/docs/",
  "https://clerk.com/docs/",
  "https://code.claude.com/docs/",
  "https://docs.coderabbit.ai/",
  "https://docs.convex.dev/",
  "https://docs.firecrawl.dev/",
  "https://docs.marimo.io/",
  "https://modelcontextprotocol.io/",
  "https://nextjs.org/blog/",
  "https://nextjs.org/docs/",
  "https://platform.claude.com/docs/",
  "https://ui.shadcn.com/docs/",
  "https://vercel.com/blog/",
  "https://vercel.com/kb/",
  "https://vercel.com/docs/",
  "https://vitest.dev/api/",
  "https://vitest.dev/config/",
  "https://vitest.dev/guide/",
]
