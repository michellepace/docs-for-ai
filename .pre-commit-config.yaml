repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.21
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: xmllint
        name: xmllint
        entry: xmllint --noout
        language: system
        types: [xml]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, toml]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, toml]
        pass_filenames: false

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, toml]
        pass_filenames: false

      - id: pytest-fast
        name: pytest (excluding firecrawl tests)
        entry: uv run pytest -m "not firecrawl"
        language: system
        types_or: [python, toml]
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest-full
        name: pytest (full suite)
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
        always_run: true

# Notes:
# 1. pre-commit excludes Firecrawl tests; pre-push runs the full suite
# 2. `pass_filenames: false` runs each Python hook over the whole codebase
# 3. `types_or: [python, toml]`: (python) .py; (toml) pyproject.toml AND uv.lock
# 4. `uv-lock` keeps uv.lock in sync with pyproject.toml
# 5. `--exit-non-zero-on-fix` blocks commits on ruff auto-fixes — review first
# 6. Install the pre-push hook once: uv run pre-commit install --hook-type pre-push
